name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    # A blocked FUSE test must not hold the runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # fusermount3, for the hung network mount test (skipped without it).
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cross-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      # The linker is configured in .cargo/config.toml.
      - run: cargo build --workspace --target aarch64-unknown-linux-gnu

  test-aarch64-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The aarch64 glibc from libc6-arm64-cross lives here; qemu reads it.
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-qemu
      - name: Install aarch64 cross linker and libc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross fuse3
      # Registers a recent qemu-user through binfmt_misc. Ubuntu's own
      # qemu-user (8.2) lacks openat2, which the scanner requires. With binfmt,
      # aarch64 binaries spawned by the tests (gx) also run under qemu.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: cargo test --workspace --target aarch64-unknown-linux-gnu
