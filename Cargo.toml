[workspace]
resolver = "3"
members = ["nucleo/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
authors = ["Dicarch"]
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Release optimizations with full debug info, for profiling (perf, flamegraphs).
[profile.bench]
inherits = "release"
debug = true

[workspace.dependencies]
gx-arena = { path = "nucleo/gx-arena" }
gx-scan = { path = "nucleo/gx-scan" }
gx-synth = { path = "nucleo/gx-synth" }
rustix = { version = "1.1", features = ["fs", "mm", "process", "param"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand_xoshiro = "0.8"
proptest = "1.6"
tempfile = "3.20"
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
io-uring = "0.7.15"
